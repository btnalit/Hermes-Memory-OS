<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes Memory-OS · 监测前端</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="mos.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0e1014; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#10141a"/>
    <circle cx="50" cy="42" r="20" fill="none" stroke="#2fbf8f" stroke-width="5" stroke-dasharray="94 32" transform="rotate(-90 50 42)"/>
    <text x="50" y="48" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#eaf0ee">OS</text>
    <text x="50" y="78" text-anchor="middle" font-family="monospace" font-size="8" fill="#7c8a86">MEMORY-OS</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="mos-data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mos-charts.jsx"></script>
<script type="text/babel" src="mos-dashboard.jsx"></script>

<script type="text/babel" data-presets="react">
  const Canvas = window.DesignCanvas;
  const Section = window.DCSection;
  const Board = window.DCArtboard;
  const Dash = window.Dashboard;

  const W = 1452;

  const themes = [
    { id: "clarity", cls: "theme-clarity", label: "A · Clarity — 浅色克制 SaaS", name: "Clarity", h: 3460 },
    { id: "control", cls: "theme-control", label: "B · Control Room — 深色 NOC 大屏", name: "Control Room", h: 3376 },
    { id: "paper",   cls: "theme-paper",   label: "C · Paper Terminal — 暖白全等宽", name: "Paper Terminal", h: 3376 },
  ];

  function App() {
    return (
      <Canvas>
        <Section id="dashboards" title="Hermes Memory-OS · 全方位数据监测"
          subtitle="同一套真实字段 · 三种视觉语言 · 点击任意画板进入全屏对比">
          {themes.map((t) => (
            <Board key={t.id} id={t.id} label={t.label} width={W} height={t.h}>
              <div className={"mos-root " + t.cls}>
                <Dash themeName={t.name} />
              </div>
            </Board>
          ))}
        </Section>
      </Canvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
