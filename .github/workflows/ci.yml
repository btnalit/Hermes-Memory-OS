name: Memory-OS CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Enforce release tag / pyproject version single source
        if: github.ref_type == 'tag'
        run: python scripts/memory_os_version_consistency_check.py --repo-root . --tag "${{ github.ref_name }}"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify non-editable wheel plugin manifests
        run: |
          WHEEL_DIR="$RUNNER_TEMP/wheels"
          python -m pip wheel --no-deps --wheel-dir "$WHEEL_DIR" .
          WHEEL="$(find "$WHEEL_DIR" -maxdepth 1 -name '*.whl' -print -quit)"
          python - "$WHEEL" <<'PY'
          import sys, zipfile
          required = {
              "plugins/memory/memory_os/plugin.yaml",
              "plugins/memory-os-agent-os/plugin.yaml",
              "plugins/seam/ragflow_evidence/config.json",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              missing = sorted(required - set(archive.namelist()))
          if missing:
              raise SystemExit(f"wheel missing plugin manifests: {missing}")
          PY
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps "$WHEEL"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.metadata
          required = {
              "plugins/memory/memory_os/plugin.yaml",
              "plugins/memory-os-agent-os/plugin.yaml",
              "plugins/seam/ragflow_evidence/config.json",
          }
          installed = {str(path) for path in importlib.metadata.files("hermes-memory-os") or ()}
          missing = sorted(required - installed)
          if missing:
              raise SystemExit(f"installed distribution missing plugin manifests: {missing}")
          PY
          )

      - name: Run mount-isolated full suite with policy gate
        run: |
          sudo "$(command -v python)" scripts/memory_os_mount_isolated_pytest.py \
            --repo-root . \
            --python "$(command -v python)" \
            --report "$RUNNER_TEMP/memory-os-pytest-policy.json"

      - name: Run import-cycle gate
        run: python scripts/memory_os_import_cycle_check.py --repo-root .

      - name: Run write-surface gate
        run: python scripts/memory_os_write_surface_check.py --repo-root . --output summary

      - name: Run static-hygiene gate
        run: python scripts/memory_os_static_hygiene_check.py --repo-root .

      - name: Run public-checkout gate
        run: python scripts/memory_os_public_checkout_probe.py --repo-root . --source working-tree --strict

      - name: Run public Closure Matrix gate
        run: python scripts/memory_os_closure_matrix_check.py --repo-root . --format summary

      - name: Reject whitespace errors in pushed range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            git diff --check "$BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}"; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            git diff --check "$BASE_SHA" HEAD
          else
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          fi

      - name: Upload pytest policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-os-pytest-policy
          path: ${{ runner.temp }}/memory-os-pytest-policy.json
          if-no-files-found: error
